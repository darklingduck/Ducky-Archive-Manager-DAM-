[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ducky-archive-manager"
version = "0.1.0"
description = "A local-first personal information organizer with conservative safety rules."
requires-python = ">=3.12"
# Known development limitation: tests currently run on Python 3.14.4;
# the declared Python 3.12 minimum has not yet been independently exercised.
dependencies = [
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "google-auth>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "google-api-python-client>=2,<3",
]

[project.scripts]
dam = "dam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dam = ["data/demo_messages.json"]

[tool.setuptools.data-files]
"share/dam/config" = ["config/settings.yaml", "config/categories.yaml", "config/rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
